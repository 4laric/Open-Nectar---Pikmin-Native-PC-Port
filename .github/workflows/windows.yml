name: Windows build

# Builds the Windows game executable with the same toolchain agents use locally
# (MSYS2 MINGW64 gcc/g++ + Ninja + SDL2, see the root AGENTS.md recipe), runs
# the p2_ host tests and publishes nectar.exe with its runtime DLLs so agents
# can download a build instead of compiling on the owner's PC.
#
# Test scope: the p2_ tests plus the Windows-only `pc_bbft_test` (and its
# `pc_bbft_background_test` variant). Only `pikmin_pc` and the executables
# behind those tests are built. A manual run with `all_targets` builds every
# target and requires `ninja -n` to report no work, which is the private
# build-dir evidence AGENTS.md asks for. The full Linux ctest still runs in
# linux.yml.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:
    inputs:
      all_targets:
        description: Build every target and require `ninja -n` to report no work
        type: boolean
        default: false
      netplay:
        description: Deterministic netplay profile; build all targets and run netplay gates
        type: boolean
        default: false
      fixtures:
        description: Optional whitespace-separated registered pikmin_ci_fixture targets (compile/package only)
        type: string
        default: ''

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same-repo PRs from claude/** branches are already built by their push run.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      # For pull_request events github.sha is the synthetic merge commit; name
      # the artifact after the requested commit; BUILD_INFO separately binds the
      # actual checked-out commit/tree (including any PR synthetic merge).
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NETPLAY_BUILD: ${{ inputs.netplay && 'ON' || 'OFF' }}
      NETPLAY_SUFFIX: ${{ inputs.netplay && '-netplay' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: 'true'
      CI_FIXTURE_TARGETS: ${{ inputs.fixtures }}
    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Fetch pinned canonical fixture guard (source only)
        uses: actions/checkout@v4
        with:
          repository: 4laric/pikmin-randomizer
          ref: 36ac5ddd2877b9308276f96b28a81e137ae58c5a
          path: .ci-root
          sparse-checkout: scripts/p2_fixture_captain_guard.h
          sparse-checkout-cone-mode: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf

      - name: Verify repository contains no game data
        run: |
          if find . -path './.git' -prune -o -type f \( -iname '*.iso' -o -iname '*.gcm' -o -iname '*.rvz' -o -path './assets/dataDir/*' \) -print -quit | grep -q .; then
            echo 'Proprietary game data found in repository'
            exit 1
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-mingw64-${{ github.sha }}
          restore-keys: |
            ccache-windows-mingw64-

      - name: Verify pinned canonical guard bytes
        run: |
          printf '%s\n' 'ee2bfeaba96020f4f0ae310f9cf98dfabbd824353d20de6fb78fec17001f3ff9  .ci-root/scripts/p2_fixture_captain_guard.h' | sha256sum -c -

      - name: Configure
        # Same cache options as the maintained native/build-randomizer tree.
        run: |
          guard_dir="$(cygpath -m "${GITHUB_WORKSPACE}")/.ci-root/scripts"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIKMIN_NATIVE_JAUDIO=ON \
            -DPIKMIN_NATIVE_OPTIMIZE=OFF \
            -DPIKMIN_NETPLAY_BUILD="${NETPLAY_BUILD}" \
            -DPIKMIN_ENABLE_IPO=ON \
            -DP2_CHALLENGE_GUARD_INCLUDE_DIR="$guard_dir"

      - name: Record actual configured source and guard identity
        run: |
          guard_dir="$(cygpath -m "${GITHUB_WORKSPACE}")/.ci-root/scripts"
          test "$(grep '^P2_CHALLENGE_GUARD_INCLUDE_DIR:PATH=' build/CMakeCache.txt | cut -d= -f2- | tr -d '\r')" = "$guard_dir"
          command -v git >/dev/null || { echo 'MSYS2 git is unavailable'; exit 1; }
          compiled_commit=$(git rev-parse --verify HEAD) || exit 1
          compiled_tree=$(git rev-parse --verify 'HEAD^{tree}') || exit 1
          [[ "$compiled_commit" =~ ^[0-9a-f]{40}$ && "$compiled_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid compiled Git commit/tree identity'; exit 1;
          }
          {
            # Legacy commit names requested source; compiled_* fields are authoritative.
            printf 'commit %s\n' "$HEAD_SHA"
            printf 'requested_commit %s\n' "$HEAD_SHA"
            printf 'compiled_commit %s\n' "$compiled_commit"
            printf 'compiled_tree %s\n' "$compiled_tree"
            printf 'profile netplay=%s\n' "$NETPLAY_BUILD"
            printf 'guard_root %s\n' '36ac5ddd2877b9308276f96b28a81e137ae58c5a'
            printf 'guard_sha256 %s\n' "$(sha256sum .ci-root/scripts/p2_fixture_captain_guard.h | cut -d' ' -f1)"
            printf 'guard_include %s\n' "$guard_dir"
          } > build/configured-source-identity.txt
          cat build/configured-source-identity.txt

      - name: Build pikmin_pc and p2/bbft test targets
        if: ${{ !inputs.all_targets && !inputs.netplay }}
        run: |
          # Every p2_ test runs an executable of the same name in the build
          # root, so the test list is the target list.
          mapfile -t p2_targets < <(grep -E '^add_test\(' build/CTestTestfile.cmake \
            | sed -E 's/^add_test\(([^ ]+) "([^"]+)".*/\1 \2/' \
            | awk '$1 ~ /p2_/ { n = $2; sub(/.*\//, "", n); sub(/\.exe$/, "", n); print n }' \
            | sort -u)
          # Admit only explicitly registered opt-in fixture targets.
          mapfile -t fixture_targets < <(tr -d '\r' < build/ci-fixtures.txt)
          for target in "${fixture_targets[@]}"; do
            [[ "$target" =~ ^pikmin_ci_fixture_[a-z0-9_]+$ ]] || {
              printf 'Rejected fixture target: %q\n' "$target"; exit 1;
            }
          done
          echo "Building pikmin_pc + ${#p2_targets[@]} p2 tests + ${#fixture_targets[@]} fixtures"
          ccache -z
          cmake --build build --target pikmin_pc pc_bbft_test "${p2_targets[@]}" "${fixture_targets[@]}" -j 4
          ccache -s
          cmake --build build --target pikmin_pc pc_bbft_test "${p2_targets[@]}" "${fixture_targets[@]}" -- -n | tee build/build-dry-run.txt
          grep -Fx "ninja: no work to do." build/build-dry-run.txt

      - name: Build all targets
        if: ${{ inputs.all_targets || inputs.netplay }}
        run: |
          ccache -z
          cmake --build build -j 4
          ccache -s
          dry_run="$(cmake --build build -- -n)"
          echo "${dry_run}"
          test "${dry_run}" = 'ninja: no work to do.'

      - name: Build explicitly requested registered fixtures
        if: ${{ inputs.fixtures != '' }}
        run: |
          mapfile -t fixture_targets < <(printf '%s\n' "$CI_FIXTURE_TARGETS" | tr '[:space:]' '\n' | sed '/^$/d' | sort -u)
          test "${#fixture_targets[@]}" -gt 0
          tr -d '\r' < build/ci-fixtures.txt > build/registered-ci-fixtures.txt
          : > build/selected-ci-fixtures.txt
          for target in "${fixture_targets[@]}"; do
            [[ "$target" =~ ^pikmin_ci_fixture_[a-z0-9_]+$ ]] || { echo 'Invalid fixture target'; exit 1; }
            grep -Fx "$target" build/registered-ci-fixtures.txt || { echo 'Unregistered fixture target'; exit 1; }
            printf '%s\n' "$target" >> build/selected-ci-fixtures.txt
          done
          cmake --build build --target "${fixture_targets[@]}" -j 4
          dry_run=$(cmake --build build --target "${fixture_targets[@]}" -- -n)
          printf '%s\n' "$dry_run" > build/selected-ci-fixtures-dry-run.txt
          cat build/selected-ci-fixtures-dry-run.txt
          test "$dry_run" = 'ninja: no work to do.'

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-windows-mingw64-${{ github.sha }}

      - name: Run p2 and bbft tests
        run: ctest --test-dir build -R 'p2_|pc_bbft_' --output-on-failure -j 4 --timeout 300

      - name: Run deterministic netplay consumer and FP gates
        if: ${{ inputs.netplay }}
        run: |
          grep -Fx 'PIKMIN_NETPLAY_BUILD:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'PIKMIN_NATIVE_OPTIMIZE:BOOL=OFF' build/CMakeCache.txt
          ctest --test-dir build -N -R 'netplay_|pc_netplay_|pc_input_log|pc_randomizer_(state_stream|outbox|campaign_net)|p2_(receipt|delivery)_host' | tr -d '\r' | tee build/netplay-test-list.txt
          for required in netplay_launch_settings_selftest netplay_launch_input_selftest netplay_launch_input_session_selftest netplay_fp_gate netplay_fp_gate_kurage pc_netplay_randstate_test; do
            grep -Eq ": ${required}$" build/netplay-test-list.txt || { echo "Missing required netplay gate: ${required}"; exit 1; }
          done
          ctest --test-dir build -R 'netplay_|pc_netplay_|pc_input_log|pc_randomizer_(state_stream|outbox|campaign_net)|p2_(receipt|delivery)_host' --no-tests=error --output-on-failure -j 4 --timeout 300

      - name: Package nectar.exe with runtime DLLs
        run: |
          out="nectar-windows-${HEAD_SHA}${NETPLAY_SUFFIX}"
          mkdir -p "${out}"
          cp build/bin/nectar.exe "${out}/"
          # Copy every non-system DLL the exe resolves from the MINGW64 prefix.
          ldd build/bin/nectar.exe | awk '{ print $3 }' | grep -i '^/mingw64/' | sort -u | while read -r dll; do
            cp "${dll}" "${out}/"
          done
          if ldd "${out}/nectar.exe" | grep -qi 'not found'; then
            echo 'Unresolved DLLs'; ldd "${out}/nectar.exe"; exit 1
          fi
          for required in nectar.exe SDL2.dll; do
            test -f "${out}/${required}" || { echo "missing ${required}"; exit 1; }
          done
          command -v git >/dev/null || { echo 'MSYS2 git is unavailable'; exit 1; }
          compiled_commit=$(git rev-parse --verify HEAD) || exit 1
          compiled_tree=$(git rev-parse --verify 'HEAD^{tree}') || exit 1
          [[ "$compiled_commit" =~ ^[0-9a-f]{40}$ && "$compiled_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid compiled Git commit/tree identity'; exit 1;
          }
          recorded_commit=$(sed -n 's/^compiled_commit //p' build/configured-source-identity.txt)
          recorded_tree=$(sed -n 's/^compiled_tree //p' build/configured-source-identity.txt)
          [[ "$recorded_commit" =~ ^[0-9a-f]{40}$ && "$recorded_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid configured Git identity'; exit 1;
          }
          test "$compiled_commit" = "$recorded_commit"
          test "$compiled_tree" = "$recorded_tree"
          cp build/configured-source-identity.txt "${out}/BUILD_INFO.txt"
          printf 'run %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${out}/BUILD_INFO.txt"
          (cd "${out}" && sha256sum *.exe *.dll > sha256.txt)
          cat "${out}/sha256.txt"
          ls -l "${out}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nectar-windows-${{ env.HEAD_SHA }}${{ env.NETPLAY_SUFFIX }}
          path: nectar-windows-${{ env.HEAD_SHA }}${{ env.NETPLAY_SUFFIX }}/
          if-no-files-found: error
          retention-days: 14

      - name: Package opt-in fixtures (compile only; no game assets)
        if: ${{ (!inputs.all_targets && !inputs.netplay) || inputs.fixtures != '' }}
        run: |
          out="pikmin-fixtures-windows-${HEAD_SHA}${NETPLAY_SUFFIX}"
          mkdir -p "${out}"
          if test -f build/selected-ci-fixtures.txt; then
            list=build/selected-ci-fixtures.txt
            cp "$list" build/selected-ci-fixtures-dry-run.txt "${out}/"
          else
            list=build/ci-fixtures.txt
            cp "$list" build/build-dry-run.txt "${out}/"
          fi
          while read -r target; do
            [[ "$target" =~ ^pikmin_ci_fixture_[a-z0-9_]+$ ]] || {
              printf 'Rejected fixture target: %q\n' "$target"; exit 1;
            }
            cp "build/fixtures/${target}.exe" "${out}/"
            ldd "build/fixtures/${target}.exe" | awk '{ print $3 }' | grep -i '^/mingw64/' | sort -u | while read -r dll; do
              cp "${dll}" "${out}/"
            done
            if ldd "${out}/${target}.exe" | grep -qi 'not found'; then
              echo 'Unresolved fixture DLLs'; exit 1
            fi
          done < <(tr -d '\r' < "$list")
          command -v git >/dev/null || { echo 'MSYS2 git is unavailable'; exit 1; }
          compiled_commit=$(git rev-parse --verify HEAD) || exit 1
          compiled_tree=$(git rev-parse --verify 'HEAD^{tree}') || exit 1
          [[ "$compiled_commit" =~ ^[0-9a-f]{40}$ && "$compiled_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid compiled Git commit/tree identity'; exit 1;
          }
          recorded_commit=$(sed -n 's/^compiled_commit //p' build/configured-source-identity.txt)
          recorded_tree=$(sed -n 's/^compiled_tree //p' build/configured-source-identity.txt)
          [[ "$recorded_commit" =~ ^[0-9a-f]{40}$ && "$recorded_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid configured Git identity'; exit 1;
          }
          test "$compiled_commit" = "$recorded_commit"
          test "$compiled_tree" = "$recorded_tree"
          cp build/configured-source-identity.txt "${out}/BUILD_INFO.txt"
          printf 'run %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${out}/BUILD_INFO.txt"
          printf '%s\n' 'TEST FIXTURES ONLY: scripted acceptance, not production' >> "${out}/BUILD_INFO.txt"
          while read -r target; do printf 'selected_target %s\n' "$target"; done < <(tr -d '\r' < "$list") >> "${out}/BUILD_INFO.txt"
          (cd "${out}" && find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)

      - name: Upload opt-in fixtures
        if: ${{ (!inputs.all_targets && !inputs.netplay) || inputs.fixtures != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pikmin-fixtures-windows-${{ env.HEAD_SHA }}${{ env.NETPLAY_SUFFIX }}
          path: pikmin-fixtures-windows-${{ env.HEAD_SHA }}${{ env.NETPLAY_SUFFIX }}/
          if-no-files-found: error
          retention-days: 14
